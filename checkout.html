<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | TOYNEXX</title>
<link rel="stylesheet" href="css/style.css">
<style>
.checkout-page{max-width:1200px;margin:120px auto 60px;padding:20px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px}
.card{background:#16161A;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:24px}
.card h2{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid .full{grid-column:1/-1}
input,select,textarea{width:100%;padding:12px;background:#0A0A0C;color:#fff;border:1px solid #333;border-radius:6px}
.summary img{width:120px;border-radius:8px}
.row{display:flex;justify-content:space-between;margin:10px 0}
.total{font-size:20px;font-weight:bold;border-top:1px solid #333;padding-top:10px}
@media(max-width:768px){.checkout-page{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="checkout-page">
<div class="card">
<h2>Shipping Details</h2>
<div class="grid">
<div><label>Full Name</label><input></div>
<div><label>Phone</label><input></div>
<div><label>Email</label><input></div>
<div><label>City</label><input></div>
<div class="full"><label>Address</label><textarea rows="3"></textarea></div>
<div><label>State</label><input></div>
<div><label>PIN Code</label><input></div>
</div>
<h2 style="margin-top:30px">Payment Method</h2>
<label><input type="radio" name="pay" checked> Cash on Delivery</label><br>
<label><input type="radio" name="pay"> UPI</label><br>
<label><input type="radio" name="pay"> Debit / Credit Card</label><br><br>
<button class="btn btn-primary btn-block">Place Order</button>
</div>

<div class="card summary">
<h2>Order Summary</h2>
<div id="summary"></div>
<div class="row"><span>Delivery</span><span>₹50</span></div>
<div class="row"><span>GST</span><span>₹0</span></div>
<div class="row total"><span>Total</span><span id="total">₹0</span></div>
</div>
</div>

<script src="js/products.js"></script>
<script>
const checkoutType = localStorage.getItem("checkoutType");

const buy = JSON.parse(localStorage.getItem("buyNowProduct"));

const cart = JSON.parse(localStorage.getItem("cart")) || [];
if(checkoutType === "buyNow" && buy){
 const p=PRODUCTS.find(x=>x.id===buy.id);
 if(p){
  const total=(Number(p.price)*buy.qty)+50;
  document.getElementById("summary").innerHTML=`
   <img src="${p.image}">
   <h3>${p.name}</h3>
   <p>Price: ₹${p.price}</p>
   <p>Quantity: ${buy.qty}</p>`;
  document.getElementById("total").textContent="₹"+total;
 }
}

if (checkoutType === "cart") {

    let total = 50;
    let html = "";

    cart.forEach(item => {

        const p = PRODUCTS.find(x => x.id === item.id);

        if (!p) return;

        total += p.price * item.qty;

        html += `
            <div style="margin-bottom:20px">
                <img src="${p.image}">
                <h3>${p.name}</h3>
                <p>Price: ₹${p.price}</p>
                <p>Quantity: ${item.qty}</p>
            </div>
        `;

    });

    document.getElementById("summary").innerHTML = html;

    document.getElementById("total").textContent = "₹" + total;

}

</script>
</body>
</html>
